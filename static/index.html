<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusMe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Focus<span>Me</span></div>
      <nav id="views"></nav>
      <div class="side-label">Tags</div>
      <nav id="tags"></nav>
      <div class="side-foot">
        <button id="exportBtn" class="small">Export</button>
        <button id="importBtn" class="small">Import</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <div class="data-path" id="dataPath"></div>
      </div>
    </aside>

    <section class="listpane">
      <div class="searchbar">
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" spellcheck="false">
        <button id="newBtn" class="primary" title="New (N)">New</button>
      </div>
      <div class="list-head" id="listHead"></div>
      <ul id="list" class="list"></ul>
    </section>

    <main class="detail" id="detail"></main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
